<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="바질·상추 사진과 환경 기록으로 생장을 분석하고 관리 행동을 추천하는 식물 생육 대시보드">
  <meta name="theme-color" content="#F3F5F0">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="자람">
  <title>자람</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/static/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/static/icons/icon-180.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="/static/css/app.css">
  <script>
    // 화면이 깜빡이지 않도록 저장된 테마를 가장 먼저 적용
    try {
      var t = localStorage.getItem('jaram-theme');
      if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
</head>
<body>
  <div id="app">
    <main id="screen" class="screen" tabindex="-1"></main>
    <nav id="tabbar" class="tabbar" aria-label="주요 메뉴" hidden></nav>
  </div>
  <div id="layer" aria-live="polite"></div>
  <noscript>자람을 사용하려면 자바스크립트를 켜 주세요.</noscript>
  <script type="module" src="/static/js/main.js"></script>
</body>
</html>
