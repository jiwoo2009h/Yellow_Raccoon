<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="사진으로 식물의 생장량을 비교하고 관리 방법을 추천하는 앱">
  <meta name="theme-color" content="#F2F4F6">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="자람">
  <title>자람</title>
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/static/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/static/icons/icon-180.png">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="/static/css/app.css">
  <script>
    // 화면이 깜빡이지 않도록 저장된 테마를 가장 먼저 적용
    try {
      var t = localStorage.getItem('jaram-theme');
      if (t === 'light' || t === 'dark') document.documentElement.dataset.theme = t;
    } catch (e) {}
  </script>
</head>
<body>
  <div id="app">
    <main id="screen" class="screen" tabindex="-1"></main>
    <nav id="tabbar" class="tabbar" aria-label="주요 메뉴" hidden></nav>
  </div>
  <div id="layer" aria-live="polite"></div>
  <noscript>자람을 사용하려면 자바스크립트를 켜 주세요.</noscript>
  <script type="module" src="/static/js/main.js"></script>
</body>
</html>
